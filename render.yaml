# VN-STOCK-AI-PRO — Render blueprint (single web service)
#
# ONE web service / ONE public URL, per P23. The Express process serves both the API and
# the built SPA, so there is no separate frontend host and no CORS surface.
#
# This blueprint is for Render only. It is NOT required by Google AI Studio, which drives
# the same `npm ci && npm run build` / `npm start` pair from its own run configuration.
#
# REQUIRED to serve: nothing beyond NODE_ENV/HOST below. The application boots with no
# secret set and reports every dependency's real state at /api/health. It never fabricates
# market data to paper over a missing dependency.
#
#   SQL_HOST, SQL_USER, SQL_PASSWORD, SQL_DB_NAME -> PostgreSQL. Optional at boot.
#       Without it the SPA, the real KBS/VPS market-data routes, analysis, recommendations
#       and paper trading all work; only /api/stocks* and /api/signals answer 500.
#       Add SQL_PORT / SQL_SSL for a managed instance.
#   GEMINI_API_KEY   -> optional; POST /api/ai/chat degrades honestly without it.
#   FIREBASE_PROJECT_ID -> optional; /api/users/me answers 401 AUTH_CONFIGURATION_REQUIRED.
#
#   VITE_FIREBASE_* -> optional AND currently unreferenced by any imported module, so
#       they are tree-shaken out of the bundle. Listed only so they can be supplied the
#       day a client sign-in UI imports them. Never place a server secret in a VITE_* var.

services:
  - type: web
    name: vn-stock-ai-pro
    runtime: node
    # 'free' (512 MB / 0.1 CPU) spins down after 15 min without inbound traffic (~1 min to
    # wake) and may restart at any time. Paper-trading, sessions and the rate limiter live in
    # memory, so each spin-down resets them and the in-process EOD scheduler does not run while
    # asleep. Acceptable for personal use; use 'starter' (always on) for anything more.
    plan: free
    region: singapore
    # NODE_ENV=production below makes `npm ci` skip devDependencies, but the build needs vite
    # and esbuild (devDependencies), so include them explicitly.
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` goes through cross-env (a devDependency); NODE_ENV is already set below.
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    # Bind 0.0.0.0 and honour the platform-provided PORT. Never hardcode a port.
    envVars:
      # Node 24 ships npm 11, which `npm ci` needs for the committed lockfile (see Dockerfile).
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: SQL_HOST
        sync: false
      - key: SQL_PORT
        sync: false
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: SQL_DB_NAME
        sync: false
      - key: SQL_SSL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
